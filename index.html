
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayEase - Hotel Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <h2>🏨 StayEase</h2>
    <nav>
        <a href="#home">Home</a>
        <a href="#rooms">Rooms</a>
        <a href="#about">About</a>
    </nav>
</header>

<section class="hero" id="home">
    <h1>Find Your Perfect Stay</h1>
    <p>Book comfortable hotels at the best prices.</p>
</section>

<section class="search-box">
    <form id="bookingForm">
        <div>
            <label>Check-in</label>
            <input type="date" id="checkin" required>
        </div>

        <div>
            <label>Check-out</label>
            <input type="date" id="checkout" required>
        </div>

        <div>
            <label>Guests</label>
            <select id="guests">
                <option value="1">1 Guest</option>
                <option value="2" selected>2 Guests</option>
                <option value="3">3 Guests</option>
                <option value="4">4 Guests</option>
            </select>
        </div>

        <button type="submit">Search Rooms</button>
    </form>
    <p id="searchMessage"></p>
</section>

<section class="rooms" id="rooms">
    <h2>Available Hotel Rooms</h2>

    <div class="filters">
        <select id="priceFilter">
            <option value="all">All Prices</option>
            <option value="5000">Under Rs. 5,000</option>
            <option value="10000">Under Rs. 10,000</option>
        </select>

        <select id="roomFilter">
            <option value="all">All Rooms</option>
            <option value="Deluxe">Deluxe</option>
            <option value="Luxury">Luxury</option>
            <option value="Standard">Standard</option>
        </select>
    </div>

    <div class="room-grid" id="roomGrid"></div>
</section>

<section class="about" id="about">
    <h2>About StayEase</h2>
    <p>StayEase makes hotel booking simple, fast and comfortable.</p>
</section>

<!-- Booking Confirmation Modal -->
<div class="modal" id="bookingModal">
    <div class="modal-content">
        <button class="close" id="closeModal">×</button>
        <h2>Booking Confirmation</h2>
        <p id="bookingDetails"></p>
        <h3 id="totalPrice"></h3>
        <button id="confirmBtn">Confirm Booking</button>
        <p id="confirmMessage"></p>
    </div>
</div>

<footer>
    <p>© 2026 StayEase Hotel Booking Platform</p>
</footer>

<script src="script.js"></script>
</body>
</html>
